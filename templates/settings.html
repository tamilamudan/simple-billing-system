{% extends "base.html" %}
{% block title %}Settings — {{ app_settings.company_name }}{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1>Organization &amp; Billing Settings</h1>
    <p class="subtitle">Customize invoice header details and optional modules.</p>
  </div>
</div>

<div class="card" style="max-width: 720px;">
  <form method="post" action="{{ url_for('update_settings_form') }}">
    <div class="form-grid">
      <div class="form-group">
        <label for="st-name">Company Name *</label>
        <input id="st-name" type="text" name="company_name" required value="{{ settings.company_name }}">
      </div>
      <div class="form-group">
        <label for="st-email">Company Email</label>
        <input id="st-email" type="email" name="company_email" value="{{ settings.company_email }}">
      </div>
      <div class="form-group">
        <label for="st-tax">Company Tax ID / GSTIN</label>
        <input id="st-tax" type="text" name="company_tax_id" value="{{ settings.company_tax_id }}">
      </div>
      <div class="form-group">
        <label for="st-prefix">Invoice Number Prefix *</label>
        <input id="st-prefix" type="text" name="invoice_prefix" required value="{{ settings.invoice_prefix }}">
      </div>
      <div class="form-group full">
        <label for="st-addr">Company Address</label>
        <textarea id="st-addr" name="company_address" rows="2">{{ settings.company_address }}</textarea>
      </div>
      <div class="form-group full">
        <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
          <input type="checkbox" name="recurring_enabled" value="1" {{ 'checked' if settings.recurring_enabled else '' }}>
          <span>Enable Recurring Billing &amp; Dunning Module</span>
        </label>
      </div>
    </div>
    <div style="margin-top: 16px;">
      <button type="submit" class="btn btn-primary">Save Settings</button>
    </div>
  </form>
</div>
{% endblock %}
